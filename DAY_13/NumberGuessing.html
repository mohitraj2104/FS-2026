<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1e293b;
        }

        .container {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2563eb;
            margin-bottom: 20px;
        }

        .instruction {
            color: #475569;
            margin-bottom: 20px;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        #resultMessage {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        #attemptMessage {
            margin-top: 10px;
            color: #475569;
            font-size: 18px;
        }

        .low {
            color: orange;
        }

        .high {
            color: crimson;
        }

        .correct {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Number Guessing Game</h1>

        <p class="instruction">
            Guess a number between 1 and 100
        </p>

        <input type="number" id="guessInput" placeholder="Enter your guess">

        <button id="guessButton">
            Submit Guess
        </button>

        <p id="resultMessage"></p>

        <p id="attemptMessage"></p>

    </div>

    <script>

        // Random number between 1 and 100
        const randomNumber = Math.floor(Math.random() * 100) + 1;

        let attempts = 0;

        const guessButton = document.getElementById('guessButton');

        guessButton.addEventListener('click', function () {

            const userGuess = parseInt(document.getElementById('guessInput').value);

            const resultMessage = document.getElementById('resultMessage');

            const attemptMessage = document.getElementById('attemptMessage');

            attempts++;

            // Reset classes
            resultMessage.className = '';

            // Validation
            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {

                resultMessage.innerText =
                    'Please enter a valid number between 1 and 100';

                resultMessage.classList.add('error');

            }

            // Too low
            else if (userGuess < randomNumber) {

                resultMessage.innerText =
                    'Too Low! Try Again';

                resultMessage.classList.add('low');

            }

            // Too high
            else if (userGuess > randomNumber) {

                resultMessage.innerText =
                    'Too High! Try Again';

                resultMessage.classList.add('high');

            }

            // Correct
            else {

                resultMessage.innerText =
                    'Congratulations! You guessed it';

                resultMessage.classList.add('correct');

            }

            attemptMessage.innerText =
                `Attempts: ${attempts}`;

        });

    </script>

</body>

</html>
